<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>缘分测试 · 你们的缘分值</title>
<style>
:root{
  --pink-1:#fff4f8; --pink-2:#ffe4ee; --pink-3:#ffcede; --pink-4:#ffb3cc;
  --deep:#c62a58; --deep2:#a51f46; --ink:#4b2334; --sub:#8e6675;
  --card:rgba(255,255,255,.76);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{overflow-x:hidden}
body{
  margin:0; color:var(--ink); min-height:100%;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(120% 80% at 12% 8%, #fff9fb 0%, rgba(255,249,251,0) 55%),
    radial-gradient(90% 70% at 88% 22%, #ffe9f2 0%, rgba(255,233,242,0) 60%),
    linear-gradient(165deg,var(--pink-1) 0%,var(--pink-2) 45%,var(--pink-3) 100%);
  background-attachment:fixed;
  display:flex; flex-direction:column;
  padding:28px 16px 40px; overflow-x:hidden;
}
/* ---------- 背景装饰 ---------- */
.hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.hearts svg{position:absolute;display:block;color:var(--pink-4);opacity:.5;
  animation:float linear infinite;filter:drop-shadow(0 2px 6px rgba(214,72,110,.18))}
@keyframes float{
  0%{transform:translateY(18px) rotate(0deg);opacity:0}
  12%{opacity:.55}
  88%{opacity:.45}
  100%{transform:translateY(-120px) rotate(22deg);opacity:0}
}
.couple{position:fixed;right:-10px;bottom:-12px;height:min(250px,30vh);width:auto;aspect-ratio:355/530;z-index:0;
  pointer-events:none;opacity:.5;filter:drop-shadow(0 8px 18px rgba(190,60,100,.14))}
.couple .b1{fill:#e8748f} .couple .b2{fill:#d9557c} .couple .hb{fill:#e8557f}
/* ---------- 卡片 ---------- */
.wrap{position:relative;z-index:2;width:100%;max-width:462px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:30px 24px 24px;
  box-shadow:0 20px 54px rgba(198,42,88,.16),0 2px 0 rgba(255,255,255,.7) inset;
  animation:rise .6s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{margin:0 0 6px;font-size:30px;letter-spacing:.22em;text-align:center;font-weight:800;
  background:linear-gradient(100deg,var(--deep2),#f0638f 55%,#d94f78);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--sub);font-size:13.5px;line-height:1.7;margin:0 0 22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--sub);letter-spacing:.12em;margin:0 0 7px 4px}
.field input{width:100%;padding:13px 15px;font-size:17px;color:var(--ink);
  border:1.5px solid rgba(214,72,110,.22);border-radius:14px;background:rgba(255,255,255,.92);
  outline:none;transition:.22s;font-family:inherit}
.field input:focus{border-color:var(--pink-4);box-shadow:0 0 0 4px rgba(255,179,204,.28);background:#fff}
.field input::placeholder{color:#c9a9b6}
.btn{display:block;width:100%;margin-top:22px;padding:14px;border:0;border-radius:999px;cursor:pointer;
  font-size:16px;font-weight:700;letter-spacing:.3em;color:#fff;font-family:inherit;
  background:linear-gradient(100deg,var(--deep2),#e5477a 60%,#f0698f);
  box-shadow:0 10px 24px rgba(198,42,88,.3);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(198,42,88,.36)}
.btn:active{transform:translateY(1px)}
.err{color:var(--deep);font-size:13px;text-align:center;margin:10px 0 0;min-height:18px}
.tiny{text-align:center;color:#a98695;font-size:11.5px;line-height:1.7;margin:16px 0 0}
/* ---------- 结果 ---------- */
.r-names{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin:0 0 24px;line-height:1.3}
.r-names .nm{font-size:clamp(22px,7.4vw,30px);font-weight:800;color:var(--deep2);letter-spacing:.05em}
.r-names .x{font-size:19px;color:var(--pink-4);font-weight:400;align-self:center}
.r-score{text-align:center}
.r-score b{display:block;font-size:54px;line-height:1;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(115deg,#b3224d 0%,#e5477a 55%,#f4789b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.r-score span{display:block;font-size:11px;color:var(--sub);letter-spacing:.3em;margin-top:10px}
.r-level{text-align:center;font-size:30px;letter-spacing:.12em;color:var(--deep2);margin:22px 0 0;font-weight:800}
.r-tag{display:block;width:fit-content;margin:12px auto 0;font-size:11px;padding:4px 13px;border-radius:999px;
  color:#fff;background:linear-gradient(100deg,#e5477a,#f4789b);letter-spacing:.2em}
.r-line{text-align:center;font-size:15px;line-height:2;color:#6b4150;margin:20px auto 0;max-width:19em}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;padding:12px;border:0;border-radius:999px;font-size:14px;font-weight:600;
  letter-spacing:.12em;cursor:pointer;font-family:inherit;transition:.2s}
.cbtn{color:#fff;background:linear-gradient(100deg,var(--deep2),#e5477a);box-shadow:0 8px 18px rgba(198,42,88,.26)}
.gbtn{color:var(--deep);background:rgba(255,255,255,.85);border:1.5px solid rgba(214,72,110,.2)}
.acts button:active{transform:translateY(1px)}
.fine{margin:16px 0 0;text-align:center;font-size:11px;color:#b1909d;letter-spacing:.06em;line-height:1.6}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(14px);
  background:rgba(75,35,52,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.28s;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:400px){h1{font-size:26px}.card{padding:26px 18px 20px}.r-score b{font-size:48px}}
@media(max-height:700px){body{padding-top:16px}.card{padding-top:24px}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<svg class="couple" viewBox="85 30 355 530" aria-hidden="true">
  <defs>

      <stop offset="0" stop-color="#ef8fa8"/><stop offset="1" stop-color="#d4507a"/>
    </linearGradient>
  </defs>
  <!-- 男 -->
  <g class="b1">

  <g class="b2"><path d="M280 296 C288 286 294 278 296 268 L314 274 C312 292 304 306 292 316 L274 328 Z"/></g>

  <g class="hb" transform="translate(300,36) scale(1.5)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>
</svg>

<main class="wrap">
  <!-- 输入 -->
  <section class="card" id="formCard">
    <h1>缘分测试</h1>
    <p class="sub">只问名字，不问出身、不问家世、不问星座。<br>同一对名字，永远是同一个结果。</p>
    <div class="field">
      <label for="male">男方名字</label>
      <input id="male" type="text" maxlength="8" placeholder="如：张伟" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="female">女方名字</label>
      <input id="female" type="text" maxlength="8" placeholder="如：李娜" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn" id="go">开 始 测 试</button>
    <p class="err" id="err"></p>
    <p class="tiny">全部计算都在你的浏览器里完成，两个名字不会离开这台设备。</p>
  </section>

  <!-- 结果 -->
  <section class="card" id="resultCard" style="display:none">
    <div class="r-names" id="names"><span class="nm" id="nameM"></span><span class="x">×</span><span class="nm" id="nameF"></span></div>
    <div class="r-score"><b id="score">0</b><span>缘分值</span></div>
    <h2 class="r-level" id="levelName"></h2>
    <span class="r-tag" id="levelTag"></span>
    <p class="r-line" id="levelLine"></p>
    <div class="acts">
      <button class="cbtn" id="copy">复制结果</button>
      <button class="gbtn" id="again">再测一次</button>
    </div>
    <p class="fine">缘分是概率，签是心情 · 本测试仅供娱乐，不构成任何建议</p>
  </section>
</main>

<div class="toast" id="toast"></div>

let BASE_ONLY = false;
function setBaseOnly(v){ BASE_ONLY = v; }
const SHENG = w => (w+1)%5;   // w 所生
const KE    = w => (w+2)%5;   // w 所克

let _bytes = null;
function dataBytes(){
  if (_bytes) return _bytes;
  const bin = atob(DATA_B64);
  const u = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  _bytes = u; return u;
}
function tailWux(strokes){
  const t = strokes % 10;
  if (t===1||t===2) return 0; if (t===3||t===4) return 1;
  if (t===5||t===6) return 2; if (t===7||t===8) return 3; return 4;
}
function charInfo(ch){
  const cp = ch.codePointAt(0);
  const i = cp - BASE_CP;
  const u = dataBytes();
  if (cp < 0x4E00 || cp > 0x9FFF || i < 0 || i >= CHAR_COUNT) return null;
  const o = i*4;
  const strokes = u[o], radical = u[o+1], tone = u[o+2];
  const fin = (u[o+3] < FINALS.length) ? FINALS[u[o+3]] : '';
  const wux = (radical>=1 && radical<=214) ? RADICAL_WUX[radical-1] : tailWux(strokes);
  return { ch, strokes, radical, tone, fin, wux };
}
function parseName(raw){
  const out = [];
  for (const ch of (raw||'')){
    if (!/[一-鿿]/.test(ch)) continue;
    const info = charInfo(ch);
    if (info) out.push(info);
  }
  return out;
}
const isPing = t => t===1 || t===2;
const isClosedFin = f => f && !['iou','uei','uen'].includes(f) && 'iuv'.includes(f[0]);
function tailLuck(strokes){
  const t = strokes % 10;
  if (t===3 || t===8) return 1;
  if (t===4 || t===9) return -1;
  return 0;
}
function fnv1a(str){
  let h = 0x811c9dc5;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}

/* 目标分布：把原始分映射到 [0,100]，保证五档都有真实占比 */
const TARGET_CDF = [[0,0],[0.08,34],[0.25,54],[0.55,74],[0.83,89],[1,100]];
function targetScore(p){
  for (let i=0;i<TARGET_CDF.length-1;i++){
    const [p0,s0]=TARGET_CDF[i], [p1,s1]=TARGET_CDF[i+1];
    if (p<=p1 || i===TARGET_CDF.length-2){
      if (p1===p0) return s1;
      const t = Math.max(0, Math.min(1,(p-p0)/(p1-p0)));
      return s0 + t*(s1-s0);
    }
  }
  return 100;
}
/* 用经验分布把原始 base 换算成百分位 p */
function percentileOf(base){
  if (typeof CALIB_TABLE === 'undefined' || !CALIB_TABLE) return base;
  const g = CALIB_TABLE.length - 1;
  let x = base * g;
  if (x < 0) x = 0; if (x > g) x = g;
  const i = Math.floor(x), f = x - i;
  const a = CALIB_TABLE[i], b = CALIB_TABLE[Math.min(g, i+1)];
  return a + (b-a)*f;
}

  const dup = s => new Set(s).size !== s.length;
  const nodup = (dup(maleRaw) || dup(femaleRaw)) ? 0.60 : 1;
  const phonScore = 0.40*tonePair + 0.25*rhyme + 0.20*openness + 0.15*nodup;

  /* ---------- ④ 形构 ---------- */
  const lenScore = (male.length === female.length) ? 1 : 0.45;
  const avgM = sumM/male.length, avgF = sumF/female.length;
  let densScore;
  if ((avgM<=8 && avgF>=12) || (avgF<=8 && avgM>=12)) densScore = 1;
  else if (Math.abs(avgM-avgF) <= 4) densScore = 0.92;
  else densScore = 0.60;
  const setM = new Set(male.map(x=>x.ch)), setF = new Set(female.map(x=>x.ch));
  const common = [...setM].filter(x => setF.has(x));
  const formScore = 0.40*lenScore + 0.30*densScore + 0.30*(common.length ? 1 : 0.90);

  /* ---------- 合成 + 校准 ---------- */
  const base = 0.40*wuxScore + 0.25*strokeScore + 0.20*phonScore + 0.15*formScore;
  if (BASE_ONLY) return {base, male, female};
  const pct = percentileOf(base);
  const key = [maleRaw.trim(), femaleRaw.trim()].sort().join('|');
  const noise = (fnv1a(key) % 9) - 4;
  let score = Math.round(targetScore(pct) + noise);
  if (common.length) score = Math.min(100, score + 2);
  score = Math.max(0, Math.min(100, score));
  const level = LEVELS.find(l => score >= l.min);

  /* ---------- 理由 ---------- */
  const R = [];
  const mwx = WUX_NAME[domM], fwx = WUX_NAME[domF];
  if (domM === domF){
    R.push({tag:'五行', text:`五行同气，都是${mwx}。脾气像照镜子：好处是心有灵犀，坏处是吵起来谁也不肯先低头。`});
  } else if (domF === SHENG(domM)){
    R.push({tag:'五行', text:`对方生你——你是${mwx}，他（她）是${fwx}。有人在替你把麻烦挡在门外，这才是这段关系真正的地基。`});
  } else if (domM === SHENG(domF)){
    R.push({tag:'五行', text:`你在托举对方——你是${mwx}，他（她）是${fwx}。你以为是自己厉害，其实是人家在背后给你兜底。`});
  } else if (domF === KE(domM)){
    R.push({tag:'五行', text:`你在消耗对方——${mwx}克${fwx}。你以为自己付出多，其实烂摊子一直是对方在收。`});
  } else {
    R.push({tag:'五行', text:`对方压着你——${fwx}克${mwx}。家里的节奏由对方定，你嘴上说没事，身体比嘴诚实。`});
  }

  const diff = Math.abs(sumM-sumF);
  if (diff <= 4) R.push({tag:'笔画', text:`两个名字笔画量级差不多（${sumM} 对 ${sumF}），写出来并排站着，谁也不压谁。`});
  else if (diff <= 12) R.push({tag:'笔画', text:`笔画一轻一重（${sumM} 对 ${sumF}），还撑得住，但总有一方得多走两步。`});
  else R.push({tag:'笔画', text:`一个厚重一个轻飘（${sumM} 对 ${sumF}）。刚开始都觉新鲜，日子久了你会发现不在同一个频道。`});
  if (luckSum <= -2) R.push({tag:'笔画', text:`有字落在凶数尾上。不是这人有问题，是这段关系有坎，绕不过去，只能踩过去。`});
  else if (luckSum >= 2) R.push({tag:'笔画', text:`两个人的字都踩在吉利尾数上，写在纸上是有底气的。`});

  if (isPing(mFirst.tone) !== isPing(fFirst.tone)) R.push({tag:'音律', text:`一个平一个仄，喊名字的时候不黏糊，叫一声对方就能抬头。`});
  else R.push({tag:'音律', text:`两个名字声调一路走到底，连着念像赶着说话，中间没有停顿。`});
  if (mLast.fin && mLast.fin === fLast.fin) R.push({tag:'音律', text:`尾字撞韵了。喊出去容易听错人——这是日常吵架的隐藏引信。`});
  else if (mOpen !== fOpen) R.push({tag:'音律', text:`一个声音敞亮，一个声音收着，吵起来谁也盖不住谁，反而不容易真急。`});
  if (dup(maleRaw) || dup(femaleRaw)) R.push({tag:'音律', text:`名字里有叠字。念着亲昵，喊急了容易糊成一片。`});

  if (male.length === female.length) R.push({tag:'形构', text:`名字长度一样，念起来是同一个节奏，走在人堆里不用喊。`});
  else R.push({tag:'形构', text:`一个名字长一个名字短。天生一个节奏拖着一个走，你俩得学会互相等。`});
  if (common.length) R.push({tag:'形构', text:`你们名字里有同一个字「${common.join('」「')}」。「命中注定」这四个字，用在这儿不算亏。`});
  else if (densScore >= 1) R.push({tag:'形构', text:`一个笔画密一个笔画疏，视觉上不打架。`});

  if (maleRaw.trim() === femaleRaw.trim())
    R.unshift({tag:'彩蛋', text:'你俩填了同一个名字——这不是缘分，这是复制粘贴。'});

  /* ---------- 对比表 ---------- */
  const wuxJudge = domM===domF ? '同气' :
      (domF===SHENG(domM)) ? '对方生我' :
      (domM===SHENG(domF)) ? '我生对方' :
      (domF===KE(domM)) ? '我克对方' : '对方克我';
  const TONE = ['轻声','阴平','阳平','上声','去声'];
  const compare = [
    {k:'五行', a:mwx, b:fwx, j:wuxJudge},
    {k:'笔画', a:sumM+' 画', b:sumF+' 画', j: diff<=4?'相当':(sumM>sumF?'男方更重':'女方更重')},
    {k:'声调', a:TONE[mFirst.tone], b:TONE[fFirst.tone], j: isPing(mFirst.tone)!==isPing(fFirst.tone)?'平仄相合':'同调连缀'},
    {k:'尾韵', a:(mLast.ch+' '+(mLast.fin||'—')), b:(fLast.ch+' '+(fLast.fin||'—')), j: (mLast.fin&&mLast.fin===fLast.fin)?'撞韵':(mOpen!==fOpen?'开阖互补':'各自成形')},
    {k:'字数', a:male.length+' 字', b:female.length+' 字', j: male.length===female.length?'齐整':'一长一短'},
  ];

  return {score, level, reasons:R, compare, pct, common, sumM, sumF, luckSum, male, female};
}
if (typeof module !== 'undefined') module.exports = {analyze, LEVELS, targetScore, percentileOf, setBaseOnly};


/* ---------------- 背景桃心 ---------------- */
(function(){
  const box = document.getElementById('hearts');
  const N = 16, PATH = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
  let seed = 20261030;
  const rnd = () => (seed = (seed*1103515245+12345) % 2147483648) / 2147483648;
  for (let i=0;i<N;i++){
    const s = 8 + rnd()*18;
    const el = document.createElementNS('http://www.w3.org/2000/svg','svg');
    el.setAttribute('viewBox','0 0 24 24');
    el.setAttribute('width', s.toFixed(1));
    el.setAttribute('height', s.toFixed(1));
    el.style.left = (rnd()*94+1).toFixed(1) + '%';
    el.style.top = (rnd()*96+2).toFixed(1) + '%';
    el.style.color = ['#ffb3cc','#ffc2d6','#ffa7c4','#ffd0de'][Math.floor(rnd()*4)];
    el.style.opacity = (0.28+rnd()*0.34).toFixed(2);
    el.style.animationDuration = (11+rnd()*13).toFixed(1)+'s';
    el.style.animationDelay = (-rnd()*20).toFixed(1)+'s';
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', PATH); p.setAttribute('fill','currentColor');
    el.appendChild(p); box.appendChild(el);
  }
})();

/* ---------------- 交互 ---------------- */
(function(){
  const $ = id => document.getElementById(id);
  const formCard = $('formCard'), resCard = $('resultCard');
  const maleEl = $('male'), femaleEl = $('female'), errEl = $('err');
  let last = null;

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1900);
  }
  function render(male, female){
    const r = analyze(male, female);
    if (!r){ errEl.textContent = '请输入中文姓名，两个都要填。'; return false; }
    last = {male, female, r};
    errEl.textContent = '';

    $('nameM').textContent = male.trim();
    $('nameF').textContent = female.trim();
    $('levelName').textContent = r.level.name;
    $('levelTag').textContent = r.level.tag;
    $('levelLine').textContent = '「' + r.level.line + '」';

    $('score').textContent = '0';
    formCard.style.display='none'; resCard.style.display='';
    let n=0; const step = Math.max(1, Math.round(r.score/45));
    const timer = setInterval(()=>{ n += step; if (n>=r.score){ n=r.score; clearInterval(timer);} $('score').textContent = n; }, 22);

    resCard.scrollIntoView({behavior:'smooth', block:'start'});
    return true;
  }

  $('go').addEventListener('click', ()=>{ render(maleEl.value, femaleEl.value); });
  [maleEl, femaleEl].forEach(el=>{
    el.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); render(maleEl.value, femaleEl.value); }});
    el.addEventListener('input', ()=>{ errEl.textContent=''; });
  });
  $('again').addEventListener('click', ()=>{
    resCard.style.display='none'; formCard.style.display='';
    maleEl.value=''; femaleEl.value='';
    maleEl.focus(); window.scrollTo({top:0,behavior:'smooth'});
  });
  $('copy').addEventListener('click', async ()=>{
    if (!last) return;
    const r = last.r;
    const txt = '【缘分测试】' + last.male.trim() + ' × ' + last.female.trim() + '\n' +
                '缘分值 ' + r.score + ' · ' + r.level.name + '\n' +
                '「' + r.level.line + '」\n' +
                '—— 缘分是概率，签是心情';
    try { await navigator.clipboard.writeText(txt); toast('结果已复制，去发给他（她）'); }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = txt;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      toast('结果已复制');
    }
  });
  window.__render = render;
})();
</script>
